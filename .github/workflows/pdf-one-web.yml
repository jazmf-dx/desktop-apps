name: pdf-one-web

# Publishes the npm package @jazmf-dx/pdf-one-web (pdf-one/web, ADR-0005) to
# GitHub Packages. Pushing a tag like pdf-one-web-v0.3.0, or running it by
# hand, builds the WebAssembly and the package from the checked-out commit and
# publishes the version in pdf-one/web/package.json.
on:
  push:
    tags: ["pdf-one-web-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack, but do not publish
        type: boolean
        default: false

permissions:
  contents: read

# A publish always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: pdf-one

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the version
        id: meta
        run: |
          version="$(jq -r .version web/package.json)"
          if [ "$version" != "$(jq -r .version package.json)" ]; then
            echo "::error::web/package.json ($version) and package.json ($(jq -r .version package.json)) must have the same version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "pdf-one-web-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match web/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: pdf-one/wasm -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same version as wasm/Cargo.toml's wasm-bindgen (it checks).
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pdf-one/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@jazmf-dx"
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run build:web

      - name: Pack
        working-directory: pdf-one/web
        run: npm pack

      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        working-directory: pdf-one/web
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
